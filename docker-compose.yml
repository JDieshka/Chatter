services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chatter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chatter}
      POSTGRES_DB: ${DB_NAME:-chatter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chatter} -d ${DB_NAME:-chatter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${DB_USER:-chatter}:${DB_PASSWORD:-chatter}@db:5432/${DB_NAME:-chatter}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MIGRATIONS_DIR: /app/migrations
      FRONTEND_DIR: /app/frontend
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
